<h1 class="page-header text-center">Pastoral</h1>
<div style="display: inline;">
    <div class="row" style="margin-top: 50px;">
        <div class="col-sm-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title"><strong>Grupos Pastorales</strong> <img src="assets/images2/pastoral2.png"
                            width="100 px" height="100px" style=" margin-left: 35%;" class="text-right"></h3>

                    <p class="card-text">Inscripción al grupo pastoral del grado que corresponda el estudiante</p>
                    <a [routerLink]="['/Pastoral/gruposPastorales']" ><img src="assets/images2/mas_detalles.png"
                        width="150px" height="50px" class="text-right" *ngIf="grupo_pastoral"></a>
                        <span class="label label-info" *ngIf="!grupo_pastoral">Proceso No Disponible</span>
                </div>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title"><strong>Grupos Sacramentales </strong> <img src="assets/images2/pastoral1.png"
                            width="100 px" height="100px" style=" margin-left: 35%;" class="text-right"></h3>

                    <p class="card-text">Inscripción a grupo sacramental y consulta de requisitos </p>
                    <a [routerLink]="['/Pastoral/gruposSacramentales']" *ngIf="grupo_sacramental"><img src="assets/images2/mas_detalles.png"
                        width="150px" height="50px" class="text-right"></a> 
                        <span class="label label-info" *ngIf="!grupo_sacramental">Proceso No Disponible</span><!--Bloquear en caso sea necesario-->
                </div>
            </div>
        </div>
    </div>
</div>
