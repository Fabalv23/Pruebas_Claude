
<style>


modal{
    display:none;
}
    .modal {
        /* modal container fixed across whole screen */
        position: fixed;
        display: inline;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        /* z-index must be higher than .modal-background */
        z-index: 1000;
        
        /* enables scrolling for tall modals */
        overflow: auto;
    }
        .modal-body {
            padding: 20px;
            background: #fff;
            
            /* margin exposes part of the modal background */
            margin: 40px;
        }
    

    .modal-background {
        /* modal background fixed across whole screen */
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        /* semi-transparent black  */
        background-color: #000;
        opacity: 0.75;
        
        /* z-index must be below .modal and above everything else  */
        z-index: 900;
    }


body.modal-open {
    /* body overflow is hidden to hide main scrollbar when modal window is open */
    overflow: hidden;
}



    
</style>

<title>Autenticación</title>

<div class="login">
    <div class="logo">
        <a href="#">
            <img src="assets/images/lasalle02.png" width="200" heigth="100" />
            
        </a>
    </div>
    <div class="content">
        <h1> Colegio La Salle</h1>
        <p> Acceso al Sistema de Informaci&oacute;n</p>
        
        <form id="CuerpoModal02" #myform1="ngForm" [formGroup]="LoginForm" (ngSubmit)="LOGIN(); myform1.reset();">
            <div class="form-group">
                <label>Cuenta Familiar</label>
                <input type="text" name="Email" class="form-control" formControlName="email" placeholder="Ingrese  cuenta " />
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="Password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña" />
            </div>
            <div class="text-left">
                <p>  <a routerLink="../login/registro" class="btn btn-link">Registrarse</a> </p>
            </div>
            <div class="text-left">

                <p>  <a class="btn btn-link" (click)="openModal('custom-modal-1')">Recuperación de Cuenta Familiar</a> </p>
                

            </div>
            
            <div class="text-right">

                <button [disabled]="loading" class="btn btn-block btn-primary">                  
                    Ingresar
                </button>
            </div>
        </form>
    </div>

    <div>
        <h1></h1>
    </div>



    
    <div class="copyright">
        <p>Copyright &copy; Mobispro - {{fecha | date:'yyyy'}}</p>
    </div>
</div>


<modal id="custom-modal-1">
    <div class="modal">
        <div class="modal-body">
            <form id="CuerpoModal02" #myform2="ngForm" [formGroup]="recuperaform" (ngSubmit)="onSubmit('custom-modal-1'); myform2.reset();">
                <fieldset id="ItemModal">
                    <div class="form-group">
                    </div>
                    
                    <div class="form-group col-md-12">
                        <label>Ingrese Código Alumno</label>
                        <input class="form-control " placeholder="21-A-0000" [textMask]="{mask: mask_cod}" type="text" id="Cuenta_Alumno" formControlName="username"  name="Cuenta_Alumno" />
                    </div>

                    <div class="form-group col-md-3">
                    </div>

                    <div class="form-group col-md-3">
                        <a href="#" class="btn btn-block btn-danger" id="Btn3GuardarModal" (click)="closeModal('custom-modal-1');">Cancelar</a>
                    </div>
                    <div class="form-group col-md-3">
                        <button [disabled]="loading" class="btn btn-block btn-primary">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                            Recuperar
                        </button>

                        
                    </div>

                    <div class="form-group col-md-3">
                    </div>


                </fieldset>
            </form>
            
        </div>
    </div>
    <div class="modal-background"></div>
</modal>
