<h2 class="text-center">
    Horario de Clases
</h2>

<h3 *ngIf="ruta_matutina != ''">Jornada Matutina</h3>
<div class="text-center" *ngIf="ruta_matutina != ''">
<img src="{{ruta_matutina}}" width="75%" height="75%">
<button type="submit" class="btn btn-success pull-right" (click)="descargar(ruta_matutina);">
    Descargar Horario
</button>
</div>
