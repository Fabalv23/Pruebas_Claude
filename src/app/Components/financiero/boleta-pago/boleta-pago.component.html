<h1 class="text-center">INGRESO DE BOLETA DE PAGO MES</h1>

<ng-container #vc></ng-container>
<ng-template #modal_1>
    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"> <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                        &times; </button>
                    <h4 class="modal-title" id="myModalLabel" style="text-align: center;"><strong> Boleta de Pago</strong>
                    </h4>
                </div>
                <div class="modal-body text-center">
                    <img src="{{ruta}}" alt="Fjords" style="width: 250px; height: 250px;">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" (click)="closeDialog()">Cerrar
                    </button>
                </div>
            </div>
            <!-- /.modal-content -->
        </div>
        <!-- /.modal -->
    </div>
</ng-template>
